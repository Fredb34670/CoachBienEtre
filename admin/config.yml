backend:
  name: git-gateway
  branch: main

# Interface en français
locale: fr

# Les images ajoutées depuis l'administration sont enregistrées dans /images
media_folder: "images"
public_folder: "/images"

# Adresse du site publié : rend fonctionnel le bouton "Vérifier l'aperçu"
# (ouvre le site en ligne dans un nouvel onglet)
site_url: "https://happy-therapie-holistique.netlify.app"

collections:
  - name: "pages"
    label: "Pages du site"
    label_singular: "Page"
    description: "Modifiez le texte de chaque page, puis cliquez sur « Publier »."
    files:
      - name: "accueil"
        label: "Accueil"
        file: "content/accueil.json"
        fields:
          - { label: "Titre principal", name: "title", widget: "string" }
          - { label: "Photo de présentation", name: "hero_image", widget: "image", required: false }
          - { label: "Introduction (sous le titre)", name: "hero_intro", widget: "html" }
          - { label: "Texte de présentation", name: "details", widget: "html" }

      - name: "pourqui"
        label: "Pour qui"
        file: "content/pourqui.json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Contenu", name: "content", widget: "html" }

      - name: "deroulement"
        label: "Déroulement"
        file: "content/deroulement.json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Contenu", name: "content", widget: "html" }

      - name: "approche"
        label: "Mon approche"
        file: "content/approche.json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Contenu", name: "content", widget: "html" }
          - { label: "Image d'illustration", name: "hero_image", widget: "image", required: false }

      - name: "tarifs"
        label: "Tarifs"
        file: "content/tarifs.json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Contenu", name: "content", widget: "html" }

      - name: "activites"
        label: "Actualités"
        file: "content/activites.json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Contenu", name: "content", widget: "html" }

      - name: "contact"
        label: "Contact"
        file: "content/contact.json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Contenu", name: "content", widget: "html" }

  - name: "reglages"
    label: "Réglages du site"
    files:
      - name: "meta"
        label: "Titre et référencement (Google)"
        file: "content/meta.json"
        fields:
          - { label: "Titre de l'onglet du navigateur", name: "title", widget: "string" }
          - { label: "Description pour Google", name: "description", widget: "text" }
          - { label: "Mots-clés", name: "keywords", widget: "string" }
