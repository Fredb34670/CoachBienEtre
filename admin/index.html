<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration – Coach Bien-Être</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/trumbowyg@2.25.1/dist/ui/trumbowyg.min.css">
<!-- Plugin Trumbowyg Colors (couleur texte et fond) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/trumbowyg@2.25.1/dist/plugins/colors/ui/trumbowyg.colors.min.css">
<style>
  :root {
    --violet: #6d4c9e;
    --violet-soft: #efe9f7;
    --ink: #2e2a33;
    --muted: #7a7482;
    --bg: #f7f5fb;
    --card: #ffffff;
    --ok: #2e7d32;
    --red: #c0392b;
    --line: #e5e0ef;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); }
  button { font: inherit; cursor: pointer; }

  /* Banner */
  .banner { background: var(--violet); color: #fff; text-align: center; padding: 8px 16px; font-size: 14px; }
  
  /* Login */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-wrap[hidden] { display: none !important; }
  #view-admin[hidden] { display: none !important; }
  .login-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 36px 40px; width: 360px; text-align: center; box-shadow: 0 8px 30px rgba(109,76,158,0.12); }
  .login-card h1 { font-size: 20px; margin: 10px 0 6px; }
  .login-card p { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .login-logo { font-size: 40px; }
  .login-card label { display: block; text-align: left; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .login-card input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; margin-bottom: 18px; }

  /* Topbar */
  .topbar { background: var(--card); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; position: sticky; top: 0; z-index: 5; }
  .topbar-title { font-size: 17px; font-weight: 600; }
  .topbar-title span { color: var(--muted); font-weight: 400; font-size: 14px; }

  /* Layout */
  .layout { display: flex; min-height: calc(100vh - 120px); }
  .sidebar { width: 240px; background: var(--card); border-right: 1px solid var(--line); padding: 20px 12px; flex-shrink: 0; overflow-y: auto; }
  .sidebar-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 8px 6px; }
  .sidebar ul { list-style: none; padding: 0; margin: 0; }
  .sidebar button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 9px 12px; border-radius: 8px; font-size: 14.5px; color: var(--ink); }
  .sidebar button:hover { background: var(--violet-soft); }
  .sidebar button.active { background: var(--violet); color: #fff; font-weight: 600; }

  .content { flex: 1; padding: 28px 32px 80px; max-width: 880px; overflow-y: auto; }
  .content h2 { font-size: 22px; margin-bottom: 4px; }
  .content .page-sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }

  /* Blocs */
  .block { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  .block-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .block-label { font-size: 13px; font-weight: 600; color: var(--violet); }
  .block-del { background: none; border: 0; color: var(--red); font-size: 13px; }
  .block-del:hover { text-decoration: underline; }
  .block input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }

  .toolbar { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .toolbar button { border: 1px solid var(--line); background: #fff; border-radius: 6px; width: 30px; height: 28px; font-size: 13px; color: var(--ink); }
  .toolbar button:hover { background: var(--violet-soft); }

  .rich { min-height: 90px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 15px; line-height: 1.55; background: #fff; }
  .rich:focus { outline: 2px solid var(--violet-soft); border-color: var(--violet); }
  .tb-btn:focus { outline: none; }

  .img-preview { border: 1px dashed var(--line); border-radius: 10px; overflow: hidden; background: #fff; margin: 8px 0; }
  .img-preview img { display: block; max-width: 100%; max-height: 260px; object-fit: cover; }
  .img-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .file-note { font-size: 12px; color: var(--muted); }

  .add-blocks { display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
  .add-blocks button { border: 1px dashed var(--violet); color: var(--violet); background: var(--violet-soft); border-radius: 8px; padding: 9px 16px; font-size: 14px; }
  .add-blocks button:hover { background: var(--violet); color: #fff; }

  /* Save bar */
  .savebar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; padding: 12px 180px 12px 28px; z-index: 6; }
  .saveInfo { font-size: 14px; }
  .saveInfo.dirty { color: #b7791f; }
  .saveInfo.clean { color: var(--muted); }
  .btn-ghost { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px; font-size: 14px; color: var(--ink); }
  .btn-primary { background: var(--violet); color: #fff; border: 0; border-radius: 8px; padding: 11px 22px; font-size: 15px; }

  /* Toast */
  .toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 22px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .toast.show { opacity: 1; }
  .toast.ok { background: var(--ok); }

  /* Trumbowyg overrides */
  .trumbowyg { max-width: 100%; }
  .tw-btn-popover ul { font-size: 14px; padding: 8px; }

  @media (max-width: 700px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; position: relative; }
    .content { padding: 16px; }
  }
</style>
</head>
<body>
<div class="banner">Espace administration – Coach Bien-Être</div>

<!-- Login View -->
<div id="view-login" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">🪷</div>
    <h1>Espace administration</h1>
    <p>Connectez-vous pour modifier le contenu du site.<br><em>Coach Bien-Être</em></p>
    <div id="userInfo" style="margin-bottom:16px;color:var(--violet);font-weight:600;display:none;"></div>
    <label for="login-pwd">Mot de passe administrateur</label>
    <input type="password" id="login-pwd" placeholder="Votre mot de passe" autocomplete="current-password">
    <button style="width:100%" onclick="admin.login()">Se connecter</button>
  </div>
</div>

<!-- Admin View -->
<div id="view-admin" hidden>
  <header class="topbar">
    <div class="topbar-title">Administration <span>· Coach Bien-Être</span></div>
    <a href="../index.html" target="_blank" rel="noopener">Voir le site ↗</a>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-label">Pages</div>
      <ul id="navList"></ul>
    </nav>

    <main class="content" id="content"></main>
  </div>

  <footer class="savebar">
    <span id="saveInfo" class="clean">Aucune modification</span>
    <div style="display:flex; gap:10px;">
      <button class="btn-ghost" onclick="admin.reset()">Réinitialiser</button>
      <button class="btn-primary" onclick="admin.save()">💾 Enregistrer</button>
    </div>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/trumbowyg@2.25.1/dist/trumbowyg.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/trumbowyg@2.25.1/dist/plugins/colors/trumbowyg.colors.min.js"></script>
<script src="admin.js"></script>
</body>
</html>
