backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "content"
    label: "Contenu des pages"
    folder: "content"
    create: false
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Contenu", name: "content", widget: "markdown" }
      - { label: "Image principale", name: "hero_image", widget: "image", required: false }
