# Configuration Netlify
[build]
  publish = "."
  functions = "netlify/functions"
  # Installe les dépendances des fonctions (notamment @netlify/blobs)
  # sans générer de node_modules à la racine du site
  command = "npm install --prefix netlify/functions --omit=dev"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-DNS-Prefetch-Control = "off"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"